<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>You're invited</title></head>
<body style="font-family: Arial, sans-serif; margin:0; padding:0; background:#f4f4f4;">
  <table width="100%" cellpadding="0" cellspacing="0" style="max-width:600px; margin:0 auto; background:#ffffff;">
    <tr>
      <td style="background:{{ primary_color }}; padding:24px; text-align:center;">
        <img src="{{ logo_url }}" alt="{{ company_name }}" style="max-height:48px;">
      </td>
    </tr>
    <tr>
      <td style="padding:32px;">
        <h1 style="color:{{ primary_color }};">You've been invited to {{ company_name }}</h1>
        <p>Hi {{ recipient_name }}, an administrator has created a staff account for you.
           Set your password to get started:</p>
        <p style="text-align:center; margin:32px 0;">
          <a href="{{ invite_link }}" style="background:{{ secondary_color }}; color:#ffffff; padding:12px 24px; text-decoration:none; border-radius:4px;">
            Set Your Password
          </a>
        </p>
        <p style="font-size:12px; color:#888888;">This link will expire soon for security reasons.</p>
      </td>
    </tr>
    <tr>
      <td style="background:#f4f4f4; padding:16px; text-align:center; font-size:12px; color:#888888;">
        {{ footer_text }}
      </td>
    </tr>
  </table>
</body>
</html>
