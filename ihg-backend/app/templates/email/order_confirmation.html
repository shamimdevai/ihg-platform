<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Order Confirmed</title></head>
<body style="font-family: Arial, sans-serif; margin:0; padding:0; background:#f4f4f4;">
  <table width="100%" cellpadding="0" cellspacing="0" style="max-width:600px; margin:0 auto; background:#ffffff;">
    <tr>
      <td style="background:{{ primary_color }}; padding:24px; text-align:center;">
        <img src="{{ logo_url }}" alt="{{ company_name }}" style="max-height:48px;">
      </td>
    </tr>
    <tr>
      <td style="padding:32px;">
        <h1 style="color:{{ primary_color }};">Your order is confirmed</h1>
        <p>Hi {{ customer_name }}, thanks for ordering from {{ company_name }}.</p>
        <table cellpadding="6" style="width:100%; border-collapse:collapse; margin-top:16px;">
          <tr><td style="color:#888888;">Order reference</td><td><strong>{{ order_reference }}</strong></td></tr>
          <tr><td style="color:#888888;">Total</td><td>{{ order_total }} {{ currency }}</td></tr>
        </table>
      </td>
    </tr>
    <tr>
      <td style="background:#f4f4f4; padding:16px; text-align:center; font-size:12px; color:#888888;">
        {{ footer_text }}
      </td>
    </tr>
  </table>
</body>
</html>
