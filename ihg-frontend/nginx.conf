server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: any path that isn't a real static file (e.g. a deep
    # link to /admin/bookings or /shop/checkout) falls back to index.html
    # so React Router can handle it client-side, instead of nginx 404ing
    # on a hard refresh/direct navigation.
    location / {
        try_files $uri $uri/ /index.html;
    }
}